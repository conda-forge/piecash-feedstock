{% set name = "piecash" %}
{% set version = "1.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/piecash-{{ version }}.tar.gz
  sha256: 916c73481c6b0addd3771dd468497ef6989b383b28d064bdae61590552b98490

build:
  number: 0
  noarch: python
  entry_points:
    - piecash = piecash.scripts.export:cli
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - click
    - python >={{ python_min }}
    - pytz
    - sqlalchemy >=1.0,<2.0
    - sqlalchemy-utils !=0.36.8
    - tzlocal

test:
  imports:
    - piecash
    - piecash.business
  commands:
    - pip check
    - piecash --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/sdementen/piecash
  summary: A pythonic interface to GnuCash SQL documents.
  doc_url: https://pythonhosted.org/piecash/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - holymonson
